services:
  banco:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-hub}
    volumes:
      - dados_banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hub} -d ${POSTGRES_DB:-hub}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Numa KVM1 de 4 GB o Postgres não pode crescer à vontade.
    command: >
      postgres -c shared_buffers=256MB -c max_connections=40
               -c work_mem=8MB -c maintenance_work_mem=64MB
    deploy:
      resources:
        limits:
          memory: 768M

  app:
    build: .
    restart: unless-stopped
    depends_on:
      banco:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hub}:${POSTGRES_PASSWORD}@banco:5432/${POSTGRES_DB:-hub}
      PORT: 3000
      VERSAO: ${VERSAO:-0.1.0}
      LOG_NIVEL: ${LOG_NIVEL:-info}
      COOKIE_SEGURO: ${COOKIE_SEGURO:-false}
      LLM_MODE: ${LLM_MODE:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      META_API_KEY: ${META_API_KEY:-}
    volumes:
      - dados_acervo:/dados/acervo
    ports:
      - "${PORTA_EXTERNA:-3000}:3000"
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  dados_banco:
  dados_acervo:
